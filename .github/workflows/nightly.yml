name: Build iPhone IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-openjdk-runtime:
    name: Build iOS 15 OpenJDK runtime
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      # The pinned OpenJDK Mobile revision was built upstream with JDK 24.
      # A JDK 26 boot compiler exposes newer PreviewFeature metadata and makes
      # the interim langtools build fail under its mandatory -Werror.
      - name: Set up Java 24 boot JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Restore runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/OpenJDK/OpenJDK.xcframework
            Vendor/OpenJDK/java_bundle-device
            Vendor/OpenJDK/java_bundle-simulator
            Vendor/OpenJDK/.ios-runtime
          key: openjdk-mobile-ios15-${{ runner.arch }}-${{ hashFiles('Scripts/build-openjdk-ios15.sh', 'Scripts/patches/openjdk-mobile-ios-runtime.patch') }}

      - name: Build runtime
        if: steps.runtime-cache.outputs.cache-matched-key == ''
        run: |
          brew install autoconf make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          bash Scripts/build-openjdk-ios15.sh

      - name: Save runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/OpenJDK/OpenJDK.xcframework
            Vendor/OpenJDK/java_bundle-device
            Vendor/OpenJDK/java_bundle-simulator
            Vendor/OpenJDK/.ios-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: OpenJDK-iOS15
          path: |
            Vendor/OpenJDK/OpenJDK.xcframework
            Vendor/OpenJDK/java_bundle-device
            Vendor/OpenJDK/java_bundle-simulator
            Vendor/OpenJDK/.ios-runtime
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build-ipa:
    name: Build unsigned IPA
    needs: build-openjdk-runtime
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify external AidokuRunner is absent
        run: bash Scripts/check-no-external-aidokurunner.sh

      - name: Download iOS 15 OpenJDK runtime
        uses: actions/download-artifact@v4
        with:
          name: OpenJDK-iOS15
          path: Vendor/OpenJDK

      - name: Bootstrap JVM compatibility layer
        run: |
          bash Scripts/bootstrap-suwayomi-compat.sh
          bash Scripts/build-mobile-shims.sh
          bash Scripts/build-extension-host.sh --test

      - name: Test optional real-world extension fixtures
        env:
          TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL: ${{ secrets.TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL }}
          TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL: ${{ secrets.TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL }}
        run: |
          if [[ -n "$TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL" && \
                -n "$TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL" ]]; then
            bash Scripts/test-mobile-java-base.sh
          else
            echo "Skipping optional extension fixture tests."
            echo "Configure both TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL and TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL repository secrets to enable them."
          fi

      - name: Build simulator app
        run: |
          xcodebuild \
            -project Aidoku.xcodeproj \
            -scheme "Aidoku (iOS)" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Set artifact name
        id: metadata
        run: |
          sha_short="${GITHUB_SHA:0:7}"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          echo "ipa_name=TachiyomiAZ-iOS-$sha_short.ipa" >> "$GITHUB_OUTPUT"

      - name: Archive iPhone app
        run: |
          xcodebuild \
            -project Aidoku.xcodeproj \
            -scheme "Aidoku (iOS)" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TachiyomiAZ.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        id: package
        env:
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
        run: |
          app_path="$RUNNER_TEMP/TachiyomiAZ.xcarchive/Products/Applications/Aidoku.app"
          package_dir="$RUNNER_TEMP/ipa-package"
          ipa_path="$RUNNER_TEMP/$IPA_NAME"

          test -d "$app_path"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/Aidoku.app"
          (
            cd "$package_dir"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_path"
          )
          unzip -t "$ipa_path"
          shasum -a 256 "$ipa_path" > "$ipa_path.sha256"

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$ipa_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiAZ-iOS-${{ steps.metadata.outputs.sha_short }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Add installation note
        env:
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
        run: |
          {
            echo "## iPhone IPA"
            echo
            echo "Built \`$IPA_NAME\` as an unsigned IPA."
            echo
            echo "Download the artifact, extract the IPA, and install it with AltStore, SideStore, or Sideloadly. The sideloading tool signs the app with your Apple ID."
          } >> "$GITHUB_STEP_SUMMARY"
