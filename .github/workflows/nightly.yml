name: Build iPhone IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-openjdk-runtime:
    name: Build iOS 15 OpenJDK runtime
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Restore runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/OpenJDK/OpenJDK.xcframework
            Vendor/OpenJDK/java_bundle-device
            Vendor/OpenJDK/java_bundle-simulator
            Vendor/OpenJDK/.ios-runtime
          key: openjdk-mobile-ios15-${{ runner.arch }}-${{ hashFiles('Scripts/build-openjdk-ios15.sh', 'Scripts/add-openjdk-static-lookup.sh', 'Scripts/patches/openjdk-mobile-ios-runtime.patch', 'iOS/JVM/OpenJDK.exports') }}

      - name: Select Xcode
        if: steps.runtime-cache.outputs.cache-matched-key == ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      # The pinned OpenJDK Mobile revision was built upstream with JDK 24.
      # A JDK 26 boot compiler exposes newer PreviewFeature metadata and makes
      # the interim langtools build fail under its mandatory -Werror.
      - name: Set up Java 24 boot JDK
        if: steps.runtime-cache.outputs.cache-matched-key == ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Build runtime
        if: steps.runtime-cache.outputs.cache-matched-key == ''
        run: |
          brew install autoconf make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          bash Scripts/build-openjdk-ios15.sh

      - name: Verify direct static symbol lookup
        if: steps.runtime-cache.outputs.cache-matched-key == ''
        run: |
          shopt -s nullglob
          archives=(
            Vendor/OpenJDK/OpenJDK.xcframework/ios-arm64/libdevice.a
            Vendor/OpenJDK/OpenJDK.xcframework/ios-*-simulator/libsim.a
          )
          if (( ${#archives[@]} != 2 )); then
            echo "Expected one device and one simulator OpenJDK archive; found ${#archives[@]}." >&2
            find Vendor/OpenJDK/OpenJDK.xcframework -type f -name '*.a' -print >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            defined_symbols="$(xcrun nm -gjU "$archive" | LC_ALL=C sort -u)"
            missing_symbols=()
            while IFS= read -r symbol; do
              if [[ -n "$symbol" ]] && ! grep -Fx "$symbol" <<< "$defined_symbols" >/dev/null; then
                missing_symbols+=("$symbol")
              fi
            done < iOS/JVM/OpenJDK.exports
            if ! grep -Fx _tachiyomiaz_lookup_static_symbol <<< "$defined_symbols" >/dev/null; then
              missing_symbols+=("_tachiyomiaz_lookup_static_symbol")
            fi
            if (( ${#missing_symbols[@]} > 0 )); then
              echo "OpenJDK registry symbols missing from $archive:" >&2
              printf '  %s\n' "${missing_symbols[@]}" >&2
              exit 1
            fi
          done

      - name: Save runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/OpenJDK/OpenJDK.xcframework
            Vendor/OpenJDK/java_bundle-device
            Vendor/OpenJDK/java_bundle-simulator
            Vendor/OpenJDK/.ios-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: OpenJDK-iOS15
          path: |
            Vendor/OpenJDK/OpenJDK.xcframework
            Vendor/OpenJDK/java_bundle-device
            Vendor/OpenJDK/java_bundle-simulator
            Vendor/OpenJDK/.ios-runtime
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build-ipa:
    name: Build unsigned IPA
    needs: build-openjdk-runtime
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify external AidokuRunner is absent
        run: bash Scripts/check-no-external-aidokurunner.sh

      - name: Download iOS 15 OpenJDK runtime
        uses: actions/download-artifact@v4
        with:
          name: OpenJDK-iOS15
          path: Vendor/OpenJDK

      - name: Restore JVM compatibility cache
        id: compatibility-cache
        uses: actions/cache@v4
        with:
          path: Runtime/ExtensionHost/compat
          key: tachiyomiaz-suwayomi-${{ runner.os }}-${{ hashFiles('Scripts/bootstrap-suwayomi-compat.sh', 'Scripts/gradle/copy-suwayomi-runtime.init.gradle') }}

      - name: Bootstrap JVM compatibility layer
        run: |
          if [[ "${{ steps.compatibility-cache.outputs.cache-hit }}" != "true" ]]; then
            for attempt in 1 2 3; do
              if bash Scripts/bootstrap-suwayomi-compat.sh; then
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "JVM compatibility bootstrap failed after $attempt attempts." >&2
                exit 1
              fi
              echo "JVM compatibility bootstrap attempt $attempt failed; retrying in 15 seconds." >&2
              sleep 15
            done
          fi
          bash Scripts/build-mobile-shims.sh
          bash Scripts/build-extension-host.sh --test

      - name: Generate JVM export list
        run: bash Scripts/generate-openjdk-exports.sh

      - name: Verify iPhone linker configuration
        run: |
          build_settings="$(
            xcodebuild \
              -project Aidoku.xcodeproj \
              -scheme "Aidoku (iOS)" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -showBuildSettings
          )"
          configuration_errors=()
          grep -F -- "-Wl,-exported_symbols_list,$GITHUB_WORKSPACE/iOS/JVM/OpenJDK.exports" <<<"$build_settings" >/dev/null ||
            configuration_errors+=("The JVM export list is not passed to the linker.")
          grep -E '^[[:space:]]*STRIP_INSTALLED_PRODUCT[[:space:]]*=[[:space:]]*NO$' <<<"$build_settings" >/dev/null ||
            configuration_errors+=("Installed-product stripping is enabled.")
          grep -E '^[[:space:]]*STRIP_STYLE[[:space:]]*=[[:space:]]*non-global$' <<<"$build_settings" >/dev/null ||
            configuration_errors+=("The fallback strip style would remove global JVM exports.")
          grep -E '^[[:space:]]*DEPLOYMENT_POSTPROCESSING[[:space:]]*=[[:space:]]*NO$' <<<"$build_settings" >/dev/null ||
            configuration_errors+=("Deployment postprocessing is enabled.")

          if (( ${#configuration_errors[@]} > 0 )); then
            printf '%s\n' "${configuration_errors[@]}" >&2
            grep -E '^[[:space:]]*(DEPLOYMENT_POSTPROCESSING|OTHER_LDFLAGS|SRCROOT|STRIP_INSTALLED_PRODUCT|STRIP_STYLE)[[:space:]]*=' <<<"$build_settings" >&2 || true
            exit 1
          fi

      - name: Test optional real-world extension fixtures
        env:
          TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL: ${{ secrets.TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL }}
          TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL: ${{ secrets.TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL }}
        run: |
          if [[ -n "$TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL" && \
                -n "$TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL" ]]; then
            bash Scripts/test-mobile-java-base.sh
          else
            echo "Skipping optional extension fixture tests."
            echo "Configure both TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL and TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL repository secrets to enable them."
          fi

      # Simulator builds are intentionally disabled in CI. Keep this recipe
      # available for local validation when simulator support changes.
      # - name: Build simulator app
      #   run: |
      #     xcodebuild \
      #       -project Aidoku.xcodeproj \
      #       -scheme "Aidoku (iOS)" \
      #       -configuration Release \
      #       -destination "generic/platform=iOS Simulator" \
      #       -skipPackagePluginValidation \
      #       ARCHS=arm64 \
      #       ONLY_ACTIVE_ARCH=YES \
      #       CODE_SIGNING_ALLOWED=NO \
      #       build

      - name: Set artifact name
        id: metadata
        run: |
          sha_short="${GITHUB_SHA:0:7}"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          echo "ipa_name=TachiyomiAZ-iOS-$sha_short.ipa" >> "$GITHUB_OUTPUT"

      - name: Archive iPhone app
        run: |
          xcodebuild \
            -project Aidoku.xcodeproj \
            -scheme "Aidoku (iOS)" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TachiyomiAZ.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify statically linked JVM exports
        run: |
          app_binary="$RUNNER_TEMP/TachiyomiAZ.xcarchive/Products/Applications/Aidoku.app/Aidoku"
          test -f "$app_binary"
          if ! xcrun nm -jU "$app_binary" | grep -Fx _tachiyomiaz_lookup_static_symbol >/dev/null; then
            echo "The archived app is missing the direct static JVM lookup." >&2
            exit 1
          fi
          exported_symbols="$({
            xcrun llvm-objdump --macho --exports-trie "$app_binary" |
              awk '{ for (field = 1; field <= NF; field++) if ($field ~ /^_[A-Za-z0-9_$.]+$/) print $field }'
          } | LC_ALL=C sort -u)"
          required_symbols=(
            _JNI_CreateJavaVM
            _JIMAGE_Open
            _JIMAGE_Close
            _JIMAGE_FindResource
            _JIMAGE_GetResource
            _JDK_Canonicalize
            _ZIP_Open
            _ZIP_Close
            _ZIP_FindEntry
            _ZIP_ReadEntry
            _ZIP_FreeEntry
            _ZIP_CRC32
            _ZIP_GZip_InitParams
            _ZIP_GZip_Fully
            _JNU_NewStringPlatform
            _GetStringPlatformChars
            _JNI_OnLoad_java
            _JNI_OnLoad_jimage
            _JNI_OnLoad_zip
            _JNI_OnLoad_net
            _JNI_OnLoad_nio
            _Java_java_lang_System_registerNatives
            _Java_jdk_internal_loader_NativeLibraries_findBuiltinLib
          )

          missing_symbols=()
          for symbol in "${required_symbols[@]}"; do
            if ! grep -Fx "$symbol" <<<"$exported_symbols" >/dev/null; then
              missing_symbols+=("$symbol")
            fi
          done

          if (( ${#missing_symbols[@]} > 0 )); then
            echo "Missing required statically linked JVM exports:" >&2
            printf '  %s\n' "${missing_symbols[@]}" >&2
            exit 1
          fi

      - name: Package unsigned IPA
        id: package
        env:
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
        run: |
          app_path="$RUNNER_TEMP/TachiyomiAZ.xcarchive/Products/Applications/Aidoku.app"
          package_dir="$RUNNER_TEMP/ipa-package"
          ipa_path="$RUNNER_TEMP/$IPA_NAME"

          test -d "$app_path"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/Aidoku.app"
          (
            cd "$package_dir"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_path"
          )
          unzip -t "$ipa_path"
          (
            cd "$(dirname "$ipa_path")"
            ipa_name="$(basename "$ipa_path")"
            shasum -a 256 "$ipa_name" > "$ipa_name.sha256"
          )

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$ipa_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiAZ-iOS-${{ steps.metadata.outputs.sha_short }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Add installation note
        env:
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
        run: |
          {
            echo "## iPhone IPA"
            echo
            echo "Built \`$IPA_NAME\` as an unsigned IPA."
            echo
            echo "Download the artifact, extract the IPA, and install it with AltStore, SideStore, or Sideloadly. The sideloading tool signs the app with your Apple ID."
          } >> "$GITHUB_STEP_SUMMARY"
