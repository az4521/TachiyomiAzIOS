name: Build iPhone IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # OpenJDK Mobile 27 requires the same JDK 25 boot toolchain used by
          # the pinned upstream snapshot build.
          java-version: "25"

      - name: Verify external AidokuRunner is absent
        run: bash Scripts/check-no-external-aidokurunner.sh

      - name: Bootstrap JVM runtime
        run: |
          bash Scripts/bootstrap-openjdk-ios.sh

      - name: Cache iOS 15 OpenJDK device runtime
        uses: actions/cache@v4
        with:
          path: Vendor/OpenJDK/OpenJDK.xcframework/ios-arm64
          key: openjdk-mobile-device-ios15-2ddf7f319f2fd-v2

      - name: Build iOS 15 OpenJDK device runtime
        run: |
          brew install autoconf make
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          bash Scripts/rebuild-openjdk-device-ios.sh

      - name: Bootstrap JVM compatibility layer
        run: |
          bash Scripts/bootstrap-suwayomi-compat.sh
          bash Scripts/build-mobile-shims.sh
          bash Scripts/build-extension-host.sh --test

      - name: Test optional real-world extension fixtures
        env:
          TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL: ${{ secrets.TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL }}
          TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL: ${{ secrets.TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL }}
        run: |
          if [[ -n "$TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL" && \
                -n "$TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL" ]]; then
            bash Scripts/test-mobile-java-base.sh
          else
            echo "Skipping optional extension fixture tests."
            echo "Configure both TACHIYOMIAZ_EXTLIB_1_4_FIXTURE_URL and TACHIYOMIAZ_EXTLIB_1_6_FIXTURE_URL repository secrets to enable them."
          fi

      - name: Set artifact name
        id: metadata
        run: |
          sha_short="${GITHUB_SHA:0:7}"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          echo "ipa_name=TachiyomiAZ-iOS-$sha_short.ipa" >> "$GITHUB_OUTPUT"

      - name: Archive iPhone app
        run: |
          xcodebuild \
            -project Aidoku.xcodeproj \
            -scheme "Aidoku (iOS)" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TachiyomiAZ.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        id: package
        env:
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
        run: |
          app_path="$RUNNER_TEMP/TachiyomiAZ.xcarchive/Products/Applications/Aidoku.app"
          package_dir="$RUNNER_TEMP/ipa-package"
          ipa_path="$RUNNER_TEMP/$IPA_NAME"

          test -d "$app_path"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/Aidoku.app"
          (
            cd "$package_dir"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_path"
          )
          unzip -t "$ipa_path"
          shasum -a 256 "$ipa_path" > "$ipa_path.sha256"

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$ipa_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiAZ-iOS-${{ steps.metadata.outputs.sha_short }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Add installation note
        env:
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
        run: |
          {
            echo "## iPhone IPA"
            echo
            echo "Built \`$IPA_NAME\` as an unsigned IPA."
            echo
            echo "Download the artifact, extract the IPA, and install it with AltStore, SideStore, or Sideloadly. The sideloading tool signs the app with your Apple ID."
          } >> "$GITHUB_STEP_SUMMARY"
